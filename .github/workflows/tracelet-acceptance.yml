name: Tracelet focused acceptance
on:
  push:
    branches: [qa/tracelet-20261105]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRACELET_PREPARATION_SHA: 231d838aa4c28ded0bef0b148cc408af2f0e51e2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Execute bounded authored checks
        run: python3 scripts/browser-ci.py
